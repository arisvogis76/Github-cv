<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOC Command Center</title>
    
    <!-- Εισαγωγή γραμματοσειρών από Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #0f1115;
            margin: 30px;
            color: #f1f5f9; 
            -webkit-font-smoothing: antialiased; 
            font-size: 18px; 
        }
        
        h1 {
            font-family: 'Orbitron', sans-serif;
            text-align: center;
            color: #ffffff;
            margin-bottom: 40px;
            font-weight: 900; 
            letter-spacing: 4px;
            text-transform: uppercase;
            font-size: 2.5rem;
            animation: fadeInDown 1.5s ease-out, neonPulse 3s infinite alternate 1.5s;
            /* Πιο αργή και ομαλή μετάβαση (0.6 δευτερόλεπτα) */
            transition: transform 0.6s ease; 
        }

        h1:hover {
            transform: scale(1.15); 
            /* Επαναφορά στο κανονικό βελάκι */
            cursor: default; 
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes neonPulse {
            from {
                text-shadow: 0 0 5px rgba(56, 189, 248, 0.4), 
                             0 0 10px rgba(56, 189, 248, 0.2);
            }
            to {
                text-shadow: 0 0 10px rgba(56, 189, 248, 0.8), 
                             0 0 20px rgba(2, 132, 199, 0.6), 
                             0 0 30px rgba(2, 132, 199, 0.4);
            }
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background-color: #1a1d24;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border-radius: 10px;
            overflow: hidden;
        }

        th, td {
            padding: 16px 20px;
            text-align: left;
            border-bottom: 1px solid #282d38;
        }

        th {
            background-color: #21252e;
            color: #e2e8f0; 
            font-weight: 700; 
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        td {
            font-weight: 600;
            color: #cbd5e1;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background-color: #252a34;
            transition: background-color 0.2s ease;
        }
    </style>
</head>
<body>

    <h1>Network Monitor</h1>

    <table>
        <thead>
            <tr>
                <th>IP Διεύθυνση</th>
                <th>Κατάσταση</th>
                <th>Ping (ms)</th>
                <th>MAC Address</th>
                <th>Τελευταίος Έλεγχος</th>
            </tr>
        </thead>
        <tbody id="table-body">
            <!-- Τα δεδομένα φορτώνονται εδώ -->
        </tbody>
    </table>

    <script>
        async function fetchData() {
            try {
                const response = await fetch('/api/devices'); 
                let devices = await response.json();

                const uniqueDevices = {};

                const parseDate = (d) => {
                    if (!d || d === '-') return '00000000000000';
                    const day = d.substring(0, 2);
                    const month = d.substring(3, 5);
                    const year = d.substring(6, 10);
                    const time = d.substring(11).replace(/:/g, ''); 
                    return year + month + day + time; 
                };

                devices.forEach(device => {
                    const ip = device.ip_address || '-';
                    
                    if (!uniqueDevices[ip]) {
                        uniqueDevices[ip] = device;
                    } else {
                        const existingDate = parseDate(uniqueDevices[ip].last_discovered);
                        const newDate = parseDate(device.last_discovered);
                        
                        if (newDate >= existingDate) {
                            uniqueDevices[ip] = device;
                        }
                    }
                });

                let finalDevices = Object.values(uniqueDevices);

                finalDevices.sort((a, b) => {
                    const formatIP = (ip) => {
                        if (!ip || !ip.includes('.')) return '000000000000';
                        return ip.split('.').map(num => num.padStart(3, '0')).join('');
                    };

                    const ipA = formatIP(a.ip_address);
                    const ipB = formatIP(b.ip_address);

                    return ipA.localeCompare(ipB); 
                });

                const tableBody = document.getElementById('table-body');
                tableBody.innerHTML = '';

                finalDevices.forEach(device => {
                    const ip = device.ip_address || '-';
                    const mac = device.mac_address || '-';
                    const lastChecked = device.last_discovered || '-';
                    const status = device.status || 'Άγνωστο';
                    const ping = device.ping !== null && device.ping !== undefined ? device.ping : '-';

                    let pingColor = '';
                    let pingNum = parseInt(ping); 

                    if (status === 'Offline') {
                        pingColor = 'color: #f87171;';
                    } else if (!isNaN(pingNum)) {
                        if (pingNum < 50) {
                            pingColor = 'color: #4ade80;'; 
                        } else if (pingNum < 150) {
                            pingColor = 'color: #fbbf24;'; 
                        } else {
                            pingColor = 'color: #f87171;'; 
                        }
                    }

                    let rowStyle = status === 'Offline' ? 'background-color: rgba(239, 68, 68, 0.08);' : '';
                    let statusColor = status === 'Offline' ? 'color: #f87171;' : (status === 'Άγνωστο' ? 'color: #94a3b8;' : 'color: #4ade80;');

                    const row = `<tr style="${rowStyle}">
                        <td style="font-weight: 700; font-size: 18px; color: #ffffff;">${ip}</td>
                        <td style="font-weight: 700; ${statusColor}">${status}</td>
                        <td style="font-weight: 700; font-size: 18px; ${pingColor}">${ping}</td>
                        <td style="font-family: 'Courier New', monospace; font-weight: 600; font-size: 16px; color: #a1a1aa;">${mac}</td>
                        <td>${lastChecked}</td>
                    </tr>`;
                    
                    tableBody.innerHTML += row;
                });
            } catch (error) {
                console.error("Σφάλμα φόρτωσης:", error);
            }
        }

        fetchData();
        setInterval(fetchData, 5000);
    </script>

</body>
</html>
